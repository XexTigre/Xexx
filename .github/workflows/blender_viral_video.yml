name: Blender viral video

on:
  push:
    branches:
      - 'feature/blender-viral-video-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VIRAL_OUT: viral_output
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Instalar FFmpeg e bibliotecas gráficas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1

      - name: Baixar Blender 4.5.10 LTS
        run: |
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.10-linux-x64.tar.xz
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.10.sha256
          grep 'blender-4.5.10-linux-x64.tar.xz' blender-4.5.10.sha256 | sha256sum -c -
          tar -xf blender-4.5.10-linux-x64.tar.xz
          echo "$PWD/blender-4.5.10-linux-x64" >> "$GITHUB_PATH"

      - name: Verificar script
        run: python -m py_compile temp/blender_viral_video/render.py

      - name: Construir e renderizar 240 frames
        run: |
          mkdir -p viral_output/frames
          xvfb-run -a blender --background --factory-startup --python temp/blender_viral_video/render.py
          test "$(find viral_output/frames -name 'frame_*.png' | wc -l)" -eq 240
          test -s viral_output/viral_button_chase.blend

      - name: Gerar trilha original
        run: |
          ffmpeg -y \
            -f lavfi -i "sine=frequency=68:sample_rate=44100:duration=10" \
            -f lavfi -i "sine=frequency=690:sample_rate=44100:duration=10" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=10" \
            -filter_complex "[0:a]volume='0.52*exp(-18*mod(t,0.4))':eval=frame[k];[1:a]volume='0.02+0.07*between(t,1.7,4.2)*abs(sin(2*PI*4*t))':eval=frame[a];[2:a]volume='0.015+0.08*between(t,6.5,7.5)':eval=frame[p];[k][a][p]amix=inputs=3:normalize=0,alimiter=limit=0.85" \
            -c:a pcm_s16le viral_output/viral_audio.wav

      - name: Codificar MP4
        run: |
          ffmpeg -y -framerate 24 -start_number 1 \
            -i viral_output/frames/frame_%05d.png \
            -i viral_output/viral_audio.wav \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -shortest \
            viral_output/viral_button_chase_preview.mp4

      - name: Revisar vídeo
        run: |
          ffmpeg -v error -i viral_output/viral_button_chase_preview.mp4 -f null - 2> viral_output/decode_errors.txt
          test ! -s viral_output/decode_errors.txt
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames,width,height,r_frame_rate:format=duration,size \
            -of json viral_output/viral_button_chase_preview.mp4 > viral_output/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('viral_output')
          probe=json.loads((root/'ffprobe.json').read_text())
          decoded=int(probe['streams'][0]['nb_read_frames'])
          rendered=len(list((root/'frames').glob('frame_*.png')))
          review={
            'status':'APPROVED' if decoded==rendered==240 else 'REJECTED',
            'frames_expected':240,
            'frames_rendered':rendered,
            'frames_decoded':decoded,
            'resolution':[360,640],
            'fps':24,
            'duration_seconds':10,
            'camera_library':30,
            'shot_cameras':15,
            'ffmpeg_decode_errors':0,
            'story':['hook','forbidden_button','monster','chase','portal','loop'],
            'probe':probe,
          }
          (root/'validation.json').write_text(json.dumps(review,indent=2,ensure_ascii=False))
          assert review['status']=='APPROVED', review
          PY
          ffmpeg -y -i viral_output/viral_button_chase_preview.mp4 \
            -vf "fps=1,scale=270:-1,tile=3x3" -frames:v 1 viral_output/contact_sheet.png
          rm -rf viral_output/frames

      - name: Publicar vídeo e projeto Blender
        uses: actions/upload-artifact@v4
        with:
          name: blender-viral-button-chase-reviewed
          path: |
            viral_output/viral_button_chase_preview.mp4
            viral_output/viral_button_chase.blend
            viral_output/viral_audio.wav
            viral_output/contact_sheet.png
            viral_output/validation.json
            viral_output/ffprobe.json
            viral_output/decode_errors.txt
            temp/blender_viral_video/render.py
          if-no-files-found: error
          retention-days: 7
