name: TikWM Roblox speed fast alt

on:
  push:
    branches:
      - 'analysis/tikwm-fast-alt-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests opencv-python-headless numpy librosa soundfile
          mkdir -p temp/tikwm_roblox_speed/results
          ffmpeg -version | head -n 1 > temp/tikwm_roblox_speed/results/tool_versions_fast.txt
      - name: Coletar e analisar
        run: python temp/tikwm_roblox_speed/analyze_api_fast.py
      - name: Limpar mídia
        if: always()
        run: rm -rf temp/tikwm_roblox_speed/videos
      - name: Publicar métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikwm-roblox-speed-fast-alt-2026-08-03
          path: temp/tikwm_roblox_speed/results/
          if-no-files-found: error
          retention-days: 7
