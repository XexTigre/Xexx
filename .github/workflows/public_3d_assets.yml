name: Public 3D asset library

on:
  push:
    branches:
      - 'assets/public-3d-library-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade requests

      - name: Baixar, validar e indexar assets
        run: python temp/public_3d_assets/download_assets.py

      - name: Publicar biblioteca revisada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-3d-assets-cc0-2026-08-03
          path: temp/public_3d_assets/bundle/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
