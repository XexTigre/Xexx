name: Internet Archive Roblox review montage

on:
  push:
    branches:
      - 'ia-roblox-review-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESULT_DIR: temp/roblox_ia_analysis_2026-08-03

jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build small visual review montages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pillow
          mapfile -t sheets < <(find "$RESULT_DIR" -mindepth 2 -maxdepth 2 -name contact_sheet.jpg | sort)
          test "${#sheets[@]}" -eq 3
          mkdir -p /tmp/review
          for i in 0 1 2; do
            ffmpeg -y -hide_banner -loglevel error -i "${sheets[$i]}" -vf 'scale=320:-2' -q:v 18 "/tmp/review/sheet_$i.jpg"
          done
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/review/sheet_0.jpg -i /tmp/review/sheet_1.jpg -i /tmp/review/sheet_2.jpg \
            -filter_complex '[0:v][1:v][2:v]vstack=inputs=3[out]' -map '[out]' -q:v 20 \
            "$RESULT_DIR/review_montage_tiny.jpg"
          cat > /tmp/micro.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import os
          root=Path(os.environ['RESULT_DIR'])
          folders=sorted([p for p in root.iterdir() if p.is_dir() and (p/'keyframes').exists()])
          cell=(80,142); cols=6; rows=len(folders)
          canvas=Image.new('RGB',(cell[0]*cols,cell[1]*rows),'black')
          for r,folder in enumerate(folders):
              frames=sorted((folder/'keyframes').glob('*.jpg'))
              if not frames: continue
              indices=[round(i*(len(frames)-1)/(cols-1)) for i in range(cols)]
              for c,index in enumerate(indices):
                  im=Image.open(frames[index]).convert('RGB')
                  im=ImageOps.fit(im,cell,method=Image.Resampling.LANCZOS)
                  draw=ImageDraw.Draw(im)
                  label=f'V{r+1}-{c+1}'
                  draw.rectangle((1,1,33,12),fill='black')
                  draw.text((3,2),label,fill='white')
                  canvas.paste(im,(c*cell[0],r*cell[1]))
          canvas.save(root/'review_grid_micro.jpg',quality=28,optimize=True,progressive=True)
          PY
          python /tmp/micro.py
          sha256sum "$RESULT_DIR/review_montage_tiny.jpg" > "$RESULT_DIR/review_montage_tiny.sha256"
          sha256sum "$RESULT_DIR/review_grid_micro.jpg" > "$RESULT_DIR/review_grid_micro.sha256"
      - name: Commit montages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR/review_montage_tiny.jpg" "$RESULT_DIR/review_montage_tiny.sha256" "$RESULT_DIR/review_grid_micro.jpg" "$RESULT_DIR/review_grid_micro.sha256"
          if ! git diff --cached --quiet; then
            git commit -m 'Adiciona grades leves para revisão visual das trends Roblox'
            git push origin HEAD:${{ github.ref_name }}
          fi
