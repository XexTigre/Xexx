name: Validate contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pytest jsonschema pyyaml
      - name: Parse JSON schemas and YAML policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('schemas').glob('*.json'):
              json.loads(path.read_text())
              print('JSON OK', path)
          for root in ('policies', 'sources'):
              for path in Path(root).glob('*.yaml'):
                  yaml.safe_load(path.read_text())
                  print('YAML OK', path)
          PY
      - name: Run adversarial tests
        run: pytest -q
      - name: Reject bootstrap or opaque payloads
        run: |
          test ! -d .bootstrap
          ! find . -type f -size +1M -print -quit | grep -q .
