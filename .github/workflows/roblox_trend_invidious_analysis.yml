name: Roblox trend Invidious analysis

on:
  push:
    branches:
      - 'invidious-run-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WORK_DIR: /tmp/roblox_trends
  RESULT_DIR: temp/roblox_trend_analysis_2026-08-03

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy pillow openai-whisper
      - name: Download through Invidious
        continue-on-error: true
        run: python temp/roblox_trend_pipeline/download_invidious_fast.py
      - name: Analyze every decoded frame
        continue-on-error: true
        run: python temp/roblox_trend_pipeline/analyze.py
      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'Salva execução Invidious isolada das trends Roblox'
            git push origin HEAD:${{ github.ref_name }}
          fi
