name: Blender viral video ultrafast

on:
  push:
    branches:
      - 'feature/blender-viral-video-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ultrafast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIRAL_OUT: viral_ultrafast_output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.10-linux-x64.tar.xz
          tar -xf blender-4.5.10-linux-x64.tar.xz
          echo "$PWD/blender-4.5.10-linux-x64" >> "$GITHUB_PATH"
      - name: Renderizar vídeo ultrarrápido
        run: |
          mkdir -p viral_ultrafast_output/frames
          python -m py_compile temp/blender_viral_video/render.py temp/blender_viral_video/render_ultrafast.py
          xvfb-run -a blender --background --factory-startup --python temp/blender_viral_video/render_ultrafast.py
          test "$(find viral_ultrafast_output/frames -name 'frame_*.png' | wc -l)" -eq 240
      - name: Codificar e revisar
        run: |
          ffmpeg -y \
            -f lavfi -i "sine=frequency=68:sample_rate=44100:duration=10" \
            -f lavfi -i "sine=frequency=690:sample_rate=44100:duration=10" \
            -filter_complex "[0:a]volume=0.35,lowpass=f=160[k];[1:a]volume=0.06,tremolo=f=4:d=0.8[a];[k][a]amix=inputs=2:normalize=0,alimiter=limit=0.85" \
            -c:a pcm_s16le viral_ultrafast_output/viral_audio.wav
          ffmpeg -y -framerate 24 -start_number 1 \
            -i viral_ultrafast_output/frames/frame_%04d.png \
            -i viral_ultrafast_output/viral_audio.wav \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -shortest \
            viral_ultrafast_output/viral_button_chase_preview.mp4
          ffmpeg -v error -i viral_ultrafast_output/viral_button_chase_preview.mp4 -f null - 2> viral_ultrafast_output/decode_errors.txt
          test ! -s viral_ultrafast_output/decode_errors.txt
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames,width,height,r_frame_rate:format=duration,size \
            -of json viral_ultrafast_output/viral_button_chase_preview.mp4 > viral_ultrafast_output/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('viral_ultrafast_output')
          p=json.loads((r/'ffprobe.json').read_text())
          d=int(p['streams'][0]['nb_read_frames'])
          n=len(list((r/'frames').glob('frame_*.png')))
          v={'status':'APPROVED' if d==n==240 else 'REJECTED','frames_expected':240,'frames_rendered':n,'frames_decoded':d,'resolution':[180,320],'fps':24,'duration_seconds':10,'camera_library':30,'shot_cameras':15,'render_engine':'BLENDER_WORKBENCH_FLAT','ffmpeg_decode_errors':0,'probe':p}
          (r/'validation.json').write_text(json.dumps(v,indent=2,ensure_ascii=False))
          assert v['status']=='APPROVED',v
          PY
          ffmpeg -y -i viral_ultrafast_output/viral_button_chase_preview.mp4 \
            -vf "fps=1,scale=270:-1,tile=3x3" -frames:v 1 \
            viral_ultrafast_output/contact_sheet.png
          rm -rf viral_ultrafast_output/frames
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: blender-viral-button-chase-ultrafast-reviewed
          path: |
            viral_ultrafast_output/viral_button_chase_preview.mp4
            viral_ultrafast_output/viral_button_chase.blend
            viral_ultrafast_output/viral_audio.wav
            viral_ultrafast_output/contact_sheet.png
            viral_ultrafast_output/validation.json
            viral_ultrafast_output/ffprobe.json
            viral_ultrafast_output/decode_errors.txt
            temp/blender_viral_video/render.py
            temp/blender_viral_video/render_ultrafast.py
          if-no-files-found: error
          retention-days: 7
