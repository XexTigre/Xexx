name: Internet Archive Roblox search

on:
  push:
    branches:
      - 'ia-roblox-search-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESULT_DIR: temp/ia_roblox_search_2026-08-03

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Search recent Roblox videos
        run: python temp/roblox_trend_pipeline/search_internet_archive.py
      - name: Save candidates
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'Salva candidatos recentes de vídeo Roblox do Internet Archive'
            git push origin HEAD:${{ github.ref_name }}
          fi
