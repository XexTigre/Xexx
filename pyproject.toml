[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-3d-contract-brain"
version = "0.2.0"
description = "Fail-closed contract and evidence gate for Roblox 3D assets"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.22", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
